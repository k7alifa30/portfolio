<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
</head>
<body>
    <div class="portfolio">
        <div class="portfolio-img">
            <img src="profile-card-img.jpg" alt="" class="image">
        </div>
        <div class="portfolio-text">
            <span class="name">ahmed ayman</span>
            <span class="jop">youtuber</span>
        </div>
        <div class="media">
            <a href="" class="links" style="background-color: #4267b2;">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="" class="links" style="background-color: #e1306c;">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="" class="links" style="background-color: #f00;">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="" class="links" style="background-color: #1da1f2;">
                <i class="fa-brands fa-twitter"></i>
            </a>
        </div>
        <div class="button">
            <button class="sub">subscribe</button>
            <button class="mess">message</button>
        </div>
        <div class="analytics">
            <div class="data">
                <i class="fa-regular fa-heart"></i>
                <span class="number">60k</span>
            </div>
            <div class="data">
                <i class="fa-regular fa-message"></i>
                <span class="number">20k</span>
            </div>
            <div class="data">
                <i class="fa-solid fa-share"></i>
                <span class="number">12k</span>
            </div>
        </div>
    </div>
</body>
</html>
